name: Build ClipTrimmer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Get ffmpeg (shared build, DLLs stored once)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          $bin = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe).DirectoryName
          New-Item -ItemType Directory ffbin | Out-Null
          Copy-Item "$bin\*.dll", "$bin\ffmpeg.exe", "$bin\ffprobe.exe" ffbin
      - name: Get libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-[0-9]*.7z" --dir mpvdev
          7z x (Get-ChildItem mpvdev -Filter *.7z).FullName -ompv
          Copy-Item (Get-ChildItem mpv -Recurse -Filter libmpv-2.dll).FullName .
      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name ClipTrimmer --add-binary "libmpv-2.dll;." --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtPdf --exclude-module PySide6.QtNetwork cliptrimmer.py
      - name: Add ffmpeg (copied in after the build so PyInstaller does not duplicate its DLLs)
        shell: pwsh
        run: Copy-Item ffbin "dist/ClipTrimmer/_internal/ffmpeg" -Recurse
      - name: Strip unused Qt parts
        shell: pwsh
        run: |
          $q = "dist/ClipTrimmer/_internal/PySide6"
          Remove-Item "$q/opengl32sw.dll", "$q/Qt6Pdf.dll", "$q/Qt6Quick*.dll", "$q/Qt6Qml*.dll", "$q/Qt6VirtualKeyboard.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item "$q/translations" -Recurse -Force -ErrorAction SilentlyContinue
      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process "dist/ClipTrimmer/ClipTrimmer.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive dist/ClipTrimmer ClipTrimmer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipTrimmer-windows
          path: ClipTrimmer-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ClipTrimmer-windows.zip
