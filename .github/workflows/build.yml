name: Build ClipTrimmer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe).FullName .
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffprobe.exe).FullName .
      - name: Get libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-[0-9]*.7z" --dir mpvdev
          7z x (Get-ChildItem mpvdev -Filter *.7z).FullName -ompv
          Copy-Item (Get-ChildItem mpv -Recurse -Filter libmpv-2.dll).FullName .
      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name ClipTrimmer --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-binary "libmpv-2.dll;." cliptrimmer.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive dist/ClipTrimmer ClipTrimmer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipTrimmer-windows
          path: ClipTrimmer-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ClipTrimmer-windows.zip
